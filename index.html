<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#79dafa">
<title>Coinbound — The Higher You Go</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#172a38;--cream:#fff8df;--orange:#ff744e;--blue:#2978de}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8f6ff;color:var(--ink);font-family:'Space Grotesk',sans-serif}body{display:grid;place-items:center}.shell{width:min(100vw,1280px);height:min(100dvh,780px);padding:16px;display:flex;flex-direction:column;gap:12px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:-.7px}.brandmark{width:38px;height:38px;border-radius:12px;background:#ffca47;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 #e69b2b}.brand small{display:block;color:#7292a1;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;margin-top:1px}.stats{display:flex;gap:8px}.pill{border:1.5px solid #d5e8e9;background:#ffffffb8;border-radius:11px;padding:8px 13px;font:700 11px 'DM Mono',monospace;letter-spacing:.4px;box-shadow:0 3px 0 #c6dfe3}.pill b{color:#e77b25;margin-left:5px}.gameframe{position:relative;flex:1;min-height:0;border:4px solid #fff;border-radius:19px;overflow:hidden;background:#70d5f5;box-shadow:0 12px 30px #5491aa2c,0 5px 0 #b1dbe2}.gameframe canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.bottom{height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 6px;color:#71909c;font:10px 'DM Mono',monospace;letter-spacing:.5px}.bottom strong{color:#4d7383}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#193a4c24,#13334e70);z-index:3;transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(430px,90%);text-align:center;padding:30px 34px 26px;border:3px solid #fff;border-radius:22px;background:#fff9e9;box-shadow:0 8px 0 #d8c99e,0 20px 50px #173a5155;animation:pop .45s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:.2}to{transform:none;opacity:1}}.eyebrow{font:700 10px 'DM Mono',monospace;color:#e57c39;letter-spacing:2px;text-transform:uppercase}.card h1{font-size:clamp(34px,6vw,52px);line-height:.96;letter-spacing:-3px;margin:10px 0 12px;color:#203849}.card p{color:#6b7b7c;font-size:14px;line-height:1.55;margin:0 auto 20px;max-width:320px}.card p strong{color:#df742e}.cta{border:0;border-radius:12px;background:#ff744e;color:white;font:700 15px 'Space Grotesk';padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #ce5135;transition:transform .12s,box-shadow .12s}.cta:hover{transform:translateY(-2px);box-shadow:0 7px 0 #ce5135}.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #ce5135}.hint{font:10px 'DM Mono',monospace;color:#91a0a0;margin-top:16px}.touch{display:none;position:absolute;bottom:15px;left:14px;right:14px;justify-content:space-between;z-index:2;pointer-events:none}.touchgroup{display:flex;gap:10px}.touch button{width:54px;height:54px;border:2px solid #ffffffbd;border-radius:16px;background:#173c586e;color:#fff;font-size:23px;font-weight:700;touch-action:none;pointer-events:auto;backdrop-filter:blur(4px)}.touch button:active{background:#ff744e}.sound{border:0;background:#ffffffb8;border:1px solid #d5e8e9;border-radius:10px;width:36px;height:36px;color:#547584;cursor:pointer;font-size:15px}@media(max-width:700px){.shell{padding:9px;gap:7px}.topbar{height:43px;padding:0 4px}.brand{font-size:16px;gap:8px}.brandmark{width:32px;height:32px}.pill{padding:7px 8px;font-size:9px}.stats{gap:5px}.gameframe{border-width:3px;border-radius:14px}.bottom{height:24px;font-size:8px}.touch{display:flex}.card{padding:24px 23px}.hint{display:none}}@media(max-height:500px){.shell{padding:6px;gap:4px}.topbar{height:34px}.brandmark{width:27px;height:27px}.bottom{height:18px}.touch{bottom:8px}.touch button{width:46px;height:46px}}
</style></head>
<body><main class="shell"><header class="topbar"><div class="brand"><div class="brandmark">↟</div><div>COINBOUND<small>the higher you go</small></div></div><div class="stats"><div class="pill">COINS <b id="coinCount">00</b></div><div class="pill">JUMP <b id="jumpStat">1×</b></div><button class="sound" id="soundBtn" aria-label="Toggle sound">♫</button></div></header><section class="gameframe"><canvas id="game" aria-label="Coinbound platform game"></canvas><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">A tiny platform adventure</div><h1 id="title">COIN<br>BOUND</h1><p id="copy">Every coin gives you a <strong>bigger jump.</strong> Stack your boost, find the sky-island, and reach the flag!</p><button class="cta" id="start">LET'S GO <span>→</span></button><div class="hint">MOVE ← → &nbsp;·&nbsp; JUMP SPACE / ↑</div></div></div><div class="touch"><div class="touchgroup"><button data-key="left" aria-label="Move left">←</button><button data-key="right" aria-label="Move right">→</button></div><button data-key="jump" aria-label="Jump">↑</button></div></section><footer class="bottom"><span><strong>TIP:</strong> Coins stack your jump power — grab every one!</span><span>NO. 01 &nbsp;·&nbsp; SUNNY SIDE UP</span></footer></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const coinLabel=document.getElementById('coinCount'),jumpLabel=document.getElementById('jumpStat');
let W=960,H=540,dpr=1,active=false,won=false,dead=false,camera=0,last=0,elapsed=0,coins=0,score=0,muted=true,audio=null;
const keys={left:false,right:false,jump:false};
const worldW=3600,gravity=1500;
const platforms=[{x:0,y:450,w:500},{x:590,y:400,w:225},{x:900,y:350,w:210},{x:1195,y:410,w:260},{x:1540,y:350,w:210},{x:1820,y:300,w:230},{x:2160,y:370,w:230},{x:2500,y:320,w:230},{x:2820,y:270,w:220},{x:3130,y:340,w:470}];
let player,coinItems,enemies,particles,checkpoints;
function reset(){coins=0;score=0;camera=0;won=dead=false;player={x:70,y:400,vx:0,vy:0,w:30,h:42,ground:false,face:1,invuln:0};coinItems=[];particles=[];enemies=[{x:700,y:377,ground:400,min:630,max:785,v:44,alive:true},{x:1650,y:327,ground:350,min:1570,max:1720,v:55,alive:true},{x:2630,y:297,ground:320,min:2520,max:2700,v:49,alive:true}];checkpoints=[{x:1265,on:false}];
const clusters=[[250,382,3],[650,325,4],[965,275,4],[1260,340,3],[1600,275,4],[1880,222,4],[2220,295,4],[2550,245,4],[2880,195,4],[3240,265,5]];
clusters.forEach(([x,y,n])=>{for(let i=0;i<n;i++)coinItems.push({x:x+i*34,y:y-Math.sin(i/(n-1||1)*Math.PI)*20,taken:false,phase:Math.random()*6.28})});updateHud()}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.max(1,r.width);H=Math.max(1,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
new ResizeObserver(resize).observe(canvas);resize();reset();
function updateHud(){coinLabel.textContent=String(coins).padStart(2,'0');jumpLabel.textContent=(1+coins*.18).toFixed(coins?1:0)+'×'}
function jumpPower(){return 560+Math.min(coins,10)*48}
function sound(freq=660,duration=.08){if(muted)return;try{audio??=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*190,vy:-Math.random()*180,life:.45,max:.45,color,size:3+Math.random()*4})}
function startGame(){reset();active=true;overlay.classList.add('hidden');if(audio&&audio.state==='suspended')audio.resume()}
document.getElementById('start').onclick=startGame;document.getElementById('soundBtn').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'♫':'♪';if(!muted)sound(600)};
function setKey(k,v){if(k==='left')keys.left=v;if(k==='right')keys.right=v;if(k==='jump'){if(v&&!keys.jump&&active&&player.ground){player.vy=-jumpPower();player.ground=false;sound(430,.1);burst(player.x+15,player.y+42,'#fff1c1',4)}keys.jump=v}}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','KeyA','KeyD','KeyW'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='KeyA')setKey('left',true);if(e.key==='ArrowRight'||e.key==='KeyD')setKey('right',true);if(e.key==='ArrowUp'||e.key==='KeyW'||e.key===' ')setKey('jump',true);if((won||dead)&&e.key==='Enter')showEnd()});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='KeyA')setKey('left',false);if(e.key==='ArrowRight'||e.key==='KeyD')setKey('right',false);if(e.key==='ArrowUp'||e.key==='KeyW'||e.key===' ')setKey('jump',false)});
document.querySelectorAll('.touch button').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setKey(k,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setKey(k,false)))});
function finish(win){if(!active)return;active=false;won=win;overlay.classList.remove('hidden');document.getElementById('eyebrow').textContent=win?'You made it to the top!':'A little too much gravity';document.getElementById('title').innerHTML=win?'SKY<br>HIGH!':'TRY<br>AGAIN';document.getElementById('copy').innerHTML=win?`You collected <strong>${coins} coins</strong> and reached the flag. That's some serious air!`:`You collected <strong>${coins} coins</strong>. Each coin makes your next run jumpier!`;document.getElementById('start').innerHTML=win?'PLAY AGAIN ↻':'TRY AGAIN ↻';document.querySelector('.hint').textContent='PRESS ENTER TO RESTART'}
function showEnd(){document.getElementById('start').click()}
function update(dt){elapsed+=dt;if(!active)return;const p=player;let dir=(keys.right?1:0)-(keys.left?1:0);p.vx+=dir*1800*dt;p.vx*=Math.pow(.0015,dt);p.vx=Math.max(-260,Math.min(260,p.vx));if(Math.abs(p.vx)>8)p.face=Math.sign(p.vx);const oldBottom=p.y+p.h;p.vy=Math.min(1050,p.vy+gravity*dt);p.x=Math.max(0,Math.min(worldW-p.w,p.x+p.vx*dt));p.y+=p.vy*dt;p.ground=false;if(p.vy>=0)for(const plat of platforms){if(p.x+p.w>plat.x&&p.x<plat.x+plat.w&&oldBottom<=plat.y+3&&p.y+p.h>=plat.y){p.y=plat.y-p.h;p.vy=0;p.ground=true;break}}if(p.y>560){if(checkpoints[0].on){p.x=1220;p.y=300;p.vy=0;p.vx=0;camera=300}else{finish(false);return}}
for(const c of coinItems){if(c.taken)continue;const cy=c.y+Math.sin(elapsed*3+c.phase)*4;if(Math.abs(p.x+p.w/2-c.x)<24&&Math.abs(p.y+p.h/2-cy)<29){c.taken=true;coins++;score+=100;p.vy=Math.min(p.vy,-100);updateHud();sound(720+coins*30,.12);burst(c.x,cy,'#ffc844',10)}}
for(const e of enemies){if(!e.alive)continue;e.x+=e.v*dt;if(e.x<e.min||e.x>e.max){e.v*=-1;e.x=Math.max(e.min,Math.min(e.max,e.x))}e.y=e.ground-23;const hit=p.x<e.x+30&&p.x+p.w>e.x&&p.y<e.y+24&&p.y+p.h>e.y;if(hit){if(p.vy>80&&p.y+p.h<e.y+18){e.alive=false;p.vy=-jumpPower()*.66;score+=250;sound(300,.15);burst(e.x+15,e.y,'#ff815e',12)}else if(p.invuln<=0){p.invuln=.9;p.vx=p.x<e.x?-260:260;p.vy=-300;coins=Math.max(0,coins-1);updateHud();sound(160,.22);burst(p.x+15,p.y+20,'#ff8065',8)}}}
if(p.invuln>0)p.invuln-=dt;for(const cp of checkpoints){if(!cp.on&&p.x>cp.x){cp.on=true;burst(cp.x,platforms[3].y,'#71d89a',12);sound(850,.15)}}if(p.x>worldW-120){finish(true);return}const target=Math.max(0,Math.min(worldW-960,p.x-960*.36));camera+=(target-camera)*Math.min(1,dt*5);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=380*dt;q.life-=dt}particles=particles.filter(q=>q.life>0)}
function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function cloud(x,y,s){ctx.fillStyle='#ffffffb5';ctx.beginPath();ctx.ellipse(x,y,s*1.1,s*.38,0,0,Math.PI*2);ctx.ellipse(x-s*.42,y+2,s*.48,s*.33,0,0,Math.PI*2);ctx.ellipse(x+s*.38,y+1,s*.55,s*.36,0,0,Math.PI*2);ctx.fill()}
function draw(){const sx=W/960,sy=H/540;ctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);ctx.clearRect(0,0,960,540);const sky=ctx.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#83def6');sky.addColorStop(1,'#c7f1df');ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);
for(let i=0;i<6;i++){const x=((i*230-camera*.16)%1250+1250)%1250-150;ctx.fillStyle=i%2?'#8edbd0':'#a3e4d7';ctx.beginPath();ctx.ellipse(x+90,440,190,115,0,Math.PI,Math.PI*2);ctx.fill()}for(let i=0;i<8;i++){const x=((i*177-camera*.28)%1150+1150)%1150-80;cloud(x,70+(i%3)*66,32+(i%2)*12)}
for(const pl of platforms){const x=pl.x-camera;if(x+pl.w< -5||x>960)continue;rect(x,pl.y,pl.w,140,8,'#b9744e');rect(x,pl.y,pl.w,13,6,'#65bb69');rect(x,pl.y+9,pl.w,5,0,'#42995d');for(let bx=x+12;bx<x+pl.w-8;bx+=26){ctx.fillStyle='#d18a58';ctx.fillRect(bx,pl.y+28,12,4);ctx.fillStyle='#965d48';ctx.fillRect(bx+7,pl.y+66,4,4)}for(let gx=x+15;gx<x+pl.w-6;gx+=32){ctx.strokeStyle='#317e56';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx,pl.y+2);ctx.lineTo(gx-3,pl.y-5);ctx.moveTo(gx+4,pl.y+3);ctx.lineTo(gx+8,pl.y-4);ctx.stroke()}}
for(const cp of checkpoints){const x=cp.x-camera,py=platforms[3].y;ctx.fillStyle='#f9f0cf';ctx.fillRect(x,py-55,4,55);ctx.fillStyle=cp.on?'#55c98b':'#ff9b61';ctx.beginPath();ctx.moveTo(x+4,py-54);ctx.lineTo(x+31,py-45);ctx.lineTo(x+4,py-35);ctx.fill()}
const gx=worldW-100-camera,gy=platforms[9].y;ctx.fillStyle='#fff4d2';ctx.fillRect(gx,gy-105,5,105);ctx.fillStyle='#ff744e';ctx.beginPath();ctx.moveTo(gx+5,gy-103);ctx.lineTo(gx+48,gy-89);ctx.lineTo(gx+5,gy-74);ctx.fill();ctx.fillStyle='#f7c74d';ctx.beginPath();ctx.arc(gx+2,gy-108,6,0,Math.PI*2);ctx.fill();rect(gx-12,gy-6,32,8,2,'#785347');
for(const c of coinItems){if(c.taken)continue;const x=c.x-camera,y=c.y+Math.sin(elapsed*3+c.phase)*4;if(x< -30||x>990)continue;ctx.fillStyle='#d78b2c';ctx.beginPath();ctx.ellipse(x,y+2,8,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd957';ctx.beginPath();ctx.ellipse(x,y,7,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff2a1';ctx.fillRect(x-2,y-7,2,6);ctx.fillStyle='#edaa31';ctx.fillRect(x+3,y-3,2,7)}
for(const e of enemies){if(!e.alive)continue;const x=e.x-camera,y=e.y;if(x< -40||x>1000)continue;ctx.fillStyle='#783d57';ctx.beginPath();ctx.ellipse(x+15,y+17,16,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef745c';ctx.beginPath();ctx.ellipse(x+15,y+12,14,10,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#ffba75';ctx.fillRect(x+4,y+12,22,4);ctx.fillStyle='#fff';ctx.fillRect(x+21,y+9,4,5);ctx.fillStyle='#263c4b';ctx.fillRect(x+23,y+10,2,3);ctx.fillStyle='#493949';ctx.fillRect(x+5,y+21,6,3);ctx.fillRect(x+19,y+21,6,3)}
const p=player,px=p.x-camera,py=p.y;if(px> -60&&px<1000){ctx.globalAlpha=p.ground?.2:.1;ctx.fillStyle='#31546a';ctx.beginPath();ctx.ellipse(px+15,py+44,16,4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;if(!(p.invuln>0&&Math.floor(elapsed*16)%2)){rect(px+3,py+34,11,8,3,'#754a43');rect(px+17,py+34,11,8,3,'#754a43');rect(px+5,py+21,20,16,4,'#397fc4');ctx.fillStyle='#ffcc54';ctx.fillRect(px+9,py+23,3,3);ctx.fillRect(px+19,py+23,3,3);rect(px+5,py+15,20,11,3,'#f77b56');rect(px+6,py+4,19,16,6,'#ffc58c');ctx.fillStyle='#fff';ctx.fillRect(px+(p.face>0?17:8),py+9,6,6);ctx.fillStyle='#263b4a';ctx.fillRect(px+(p.face>0?20:9),py+11,3,4);rect(px+3,py+1,23,7,4,'#e95045');rect(px+(p.face>0?17:3),py+6,13,4,2,'#e95045');ctx.fillStyle='#fff';ctx.font='bold 6px sans-serif';ctx.fillText('C',px+12,py+6)}}
for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.color;ctx.fillRect(q.x-camera,q.y,q.size,q.size)}ctx.globalAlpha=1;rect(18,18,170,7,4,'#ffffff8c');rect(18,18,170*Math.min(1,p.x/worldW),7,4,'#ffca4a');ctx.fillStyle='#305c6a';ctx.font='700 10px monospace';ctx.fillText('SKYBOUND',18,39);if(coins>0){rect(812,18,130,31,9,'#fff7dddc');ctx.fillStyle='#b87327';ctx.font='700 11px monospace';ctx.fillText('↑ JUMP +'+(coins*18)+'%',825,38)}}
function frame(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
